apiVersion: apps/v1
kind: Deployment
metadata:
  name: coop-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coop-app
  template:
    metadata:
      labels:
        app: coop-app
    spec:
      containers:
      - name: coop-app
        image: 992382369527.dkr.ecr.ap-northeast-2.amazonaws.com/gmna-deployment:coop
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mariadb://svc.sel4.cloudtype.app:30333/coop"
        - name: SPRING_DATASOURCE_USERNAME
          value: "rmsals"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "1q2w3e" # 여기에 실제 비밀번호를 입력하세요
---
apiVersion: v1
kind: Service
metadata:
  name: coop-app-service
spec:
  selector:
    app: coop-app
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer